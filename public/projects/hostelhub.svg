<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0d14" />
      <stop offset="100%" stop-color="#05070a" />
    </linearGradient>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="800" height="500" fill="url(#bg)" />
  <rect width="800" height="500" fill="url(#grid)" />
  <rect x="20" y="20" width="760" height="460" rx="12" fill="rgba(255,255,255,0.01)" stroke="rgba(255,255,255,0.08)" />

  <!-- Top bar -->
  <g transform="translate(40, 42)">
    <text x="0" y="16" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="700" fill="#ffffff">HostelHub — Inventory Management</text>
    <text x="0" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#94a3b8">Campus hostel asset tracking system (Ranked 7th out of 150+ teams in Scaler Hackathon)</text>
  </g>

  <!-- Flow pipeline -->
  <g transform="translate(40, 96)">

    <g transform="translate(0, 0)">
      <rect width="125" height="56" rx="6" fill="#0f172a" stroke="rgba(255,255,255,0.12)" stroke-width="1" />
      <text x="12" y="24" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="600" fill="#e2e8f0">Room Portal</text>
      <text x="12" y="42" font-family="ui-monospace, monospace" font-size="9.5" fill="#64748b">Student dashboard</text>
    </g>

    <path d="M 129 28 L 139 28" stroke="rgba(255,255,255,0.25)" stroke-width="1.5" />
    <polygon points="139,25 143,28 139,31" fill="rgba(255,255,255,0.4)" />

    <g transform="translate(145, 0)">
      <rect width="125" height="56" rx="6" fill="#0f172a" stroke="rgba(255,255,255,0.12)" stroke-width="1" />
      <text x="12" y="24" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="600" fill="#e2e8f0">Asset Catalog</text>
      <text x="12" y="42" font-family="ui-monospace, monospace" font-size="9.5" fill="#64748b">Amenities registry</text>
    </g>

    <path d="M 274 28 L 284 28" stroke="rgba(255,255,255,0.25)" stroke-width="1.5" />
    <polygon points="284,25 288,28 284,31" fill="rgba(255,255,255,0.4)" />

    <g transform="translate(290, 0)">
      <rect width="125" height="56" rx="6" fill="#0f172a" stroke="rgba(255,255,255,0.12)" stroke-width="1" />
      <text x="12" y="24" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="600" fill="#e2e8f0">Allocation</text>
      <text x="12" y="42" font-family="ui-monospace, monospace" font-size="9.5" fill="#64748b">Transaction state</text>
    </g>

    <path d="M 419 28 L 429 28" stroke="rgba(255,255,255,0.25)" stroke-width="1.5" />
    <polygon points="429,25 433,28 429,31" fill="rgba(255,255,255,0.4)" />

    <g transform="translate(435, 0)">
      <rect width="125" height="56" rx="6" fill="#0f172a" stroke="rgba(255,255,255,0.12)" stroke-width="1" />
      <text x="12" y="24" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="600" fill="#e2e8f0">Issue Ticket</text>
      <text x="12" y="42" font-family="ui-monospace, monospace" font-size="9.5" fill="#64748b">Maintenance queue</text>
    </g>

    <path d="M 564 28 L 574 28" stroke="rgba(255,255,255,0.25)" stroke-width="1.5" />
    <polygon points="574,25 578,28 574,31" fill="rgba(255,255,255,0.4)" />

    <g transform="translate(580, 0)">
      <rect width="125" height="56" rx="6" fill="#0f172a" stroke="rgba(255,255,255,0.12)" stroke-width="1" />
      <text x="12" y="24" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="600" fill="#e2e8f0">Admin Audit</text>
      <text x="12" y="42" font-family="ui-monospace, monospace" font-size="9.5" fill="#64748b">Batch operations</text>
    </g>

  </g>

  <!-- Code window -->
  <g transform="translate(40, 175)">
    <rect width="720" height="280" rx="8" fill="#030508" stroke="rgba(255,255,255,0.08)" />
    <!-- Window header -->
    <rect width="720" height="34" rx="8" fill="rgba(255,255,255,0.025)" />
    <circle cx="16" cy="17" r="4.5" fill="#ef4444" opacity="0.7"/>
    <circle cx="30" cy="17" r="4.5" fill="#f59e0b" opacity="0.7"/>
    <circle cx="44" cy="17" r="4.5" fill="#10b981" opacity="0.7"/>
    <text x="64" y="21" font-family="ui-monospace, monospace" font-size="11" fill="#94a3b8">allocationService.js</text>
    <text x="680" y="21" font-family="ui-monospace, monospace" font-size="10" fill="#475569">JavaScript</text>
    <line x1="0" y1="34" x2="720" y2="34" stroke="rgba(255,255,255,0.06)" />
    <text x="16" y="62" font-family="ui-monospace, monospace" font-size="11" fill="#334155">01</text>
    <text x="50" y="62" font-family="ui-monospace, monospace" font-size="11.5"><tspan fill="#c084fc">async function </tspan><tspan fill="#f59e0b">checkoutAsset</tspan><tspan fill="#cbd5e1">(studentId, assetId) {</tspan></text>
    <text x="16" y="84" font-family="ui-monospace, monospace" font-size="11" fill="#334155">02</text>
    <text x="50" y="84" font-family="ui-monospace, monospace" font-size="11.5"><tspan fill="#cbd5e1">  const session = await mongoose.</tspan><tspan fill="#f59e0b">startSession</tspan><tspan fill="#cbd5e1">();</tspan></text>
    <text x="16" y="106" font-family="ui-monospace, monospace" font-size="11" fill="#334155">03</text>
    <text x="50" y="106" font-family="ui-monospace, monospace" font-size="11.5"><tspan fill="#cbd5e1">  return session.</tspan><tspan fill="#f59e0b">withTransaction</tspan><tspan fill="#cbd5e1">(async () =&gt; {</tspan></text>
    <text x="16" y="128" font-family="ui-monospace, monospace" font-size="11" fill="#334155">04</text>
    <text x="50" y="128" font-family="ui-monospace, monospace" font-size="11.5"><tspan fill="#cbd5e1">    const asset = await Asset.</tspan><tspan fill="#f59e0b">findByIdAndUpdate</tspan><tspan fill="#cbd5e1">(assetId, {</tspan></text>
    <text x="16" y="150" font-family="ui-monospace, monospace" font-size="11" fill="#334155">05</text>
    <text x="50" y="150" font-family="ui-monospace, monospace" font-size="11.5"><tspan fill="#a7f3d0">      status: 'ALLOCATED', holder: studentId, allocatedAt: new Date()</tspan></text>
    <text x="16" y="172" font-family="ui-monospace, monospace" font-size="11" fill="#334155">06</text>
    <text x="50" y="172" font-family="ui-monospace, monospace" font-size="11.5"><tspan fill="#cbd5e1">    });</tspan></text>
    <text x="16" y="194" font-family="ui-monospace, monospace" font-size="11" fill="#334155">07</text>
    <text x="50" y="194" font-family="ui-monospace, monospace" font-size="11.5"><tspan fill="#cbd5e1">    await AuditLog.</tspan><tspan fill="#f59e0b">create</tspan><tspan fill="#cbd5e1">([{ assetId, action: 'CHECKOUT', studentId }], { session });</tspan></text>
    <text x="16" y="216" font-family="ui-monospace, monospace" font-size="11" fill="#334155">08</text>
    <text x="50" y="216" font-family="ui-monospace, monospace" font-size="11.5"><tspan fill="#c084fc">    return asset;</tspan></text>
    <text x="16" y="238" font-family="ui-monospace, monospace" font-size="11" fill="#334155">09</text>
    <text x="50" y="238" font-family="ui-monospace, monospace" font-size="11.5"><tspan fill="#cbd5e1">  });</tspan></text>
    <text x="16" y="260" font-family="ui-monospace, monospace" font-size="11" fill="#334155">10</text>
    <text x="50" y="260" font-family="ui-monospace, monospace" font-size="11.5"><tspan fill="#cbd5e1">}</tspan></text>
  </g>
</svg>