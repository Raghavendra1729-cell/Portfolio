      <stop offset="0%" stop-color="#080b11" />
      <stop offset="50%" stop-color="#0c1017" />
      <stop offset="100%" stop-color="#06080d" />
    </linearGradient>
    <pattern id="grid_http" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
    </pattern>
    <linearGradient id="accent_http" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0.3" />
    </linearGradient>
  </defs>

  <rect width="800" height="500" fill="url(#bg_http)" />
