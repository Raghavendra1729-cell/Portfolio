<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bg_lost" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080b11" />
      <stop offset="50%" stop-color="#0c1017" />
      <stop offset="100%" stop-color="#06080d" />
    </linearGradient>
    <pattern id="grid_lost" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
    </pattern>
    <linearGradient id="accent_lost" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0.3" />
    </linearGradient>
  </defs>

  <rect width="800" height="500" fill="url(#bg_lost)" />
  <rect width="800" height="500" fill="url(#grid_lost)" />
  <rect x="0" y="0" width="800" height="3" fill="url(#accent_lost)" />

  <rect x="24" y="24" width="752" height="452" rx="12" fill="rgba(255,255,255,0.015)" stroke="rgba(255,255,255,0.08)" />

  <g transform="translate(48, 56)">
