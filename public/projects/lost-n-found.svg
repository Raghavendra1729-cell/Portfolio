<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0d14" />
      <stop offset="100%" stop-color="#05070a" />
    </linearGradient>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="800" height="500" fill="url(#bg)" />
  <rect width="800" height="500" fill="url(#grid)" />
  <rect x="20" y="20" width="760" height="460" rx="12" fill="rgba(255,255,255,0.01)" stroke="rgba(255,255,255,0.08)" />

  <!-- Top bar -->
  <g transform="translate(40, 42)">
    <text x="0" y="16" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="700" fill="#ffffff">Lost-n-Found Platform</text>
    <text x="0" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#94a3b8">Campus lost & found recovery application with Google OAuth and real-time WebSocket chat</text>
  </g>

  <!-- Flow pipeline -->
  <g transform="translate(40, 96)">

    <g transform="translate(0, 0)">
      <rect width="125" height="56" rx="6" fill="#0f172a" stroke="rgba(255,255,255,0.12)" stroke-width="1" />
      <text x="12" y="24" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="600" fill="#e2e8f0">Item Listing</text>
      <text x="12" y="42" font-family="ui-monospace, monospace" font-size="9.5" fill="#64748b">Photo & details</text>
    </g>

    <path d="M 129 28 L 139 28" stroke="rgba(255,255,255,0.25)" stroke-width="1.5" />
    <polygon points="139,25 143,28 139,31" fill="rgba(255,255,255,0.4)" />

    <g transform="translate(145, 0)">
      <rect width="125" height="56" rx="6" fill="#0f172a" stroke="rgba(255,255,255,0.12)" stroke-width="1" />
      <text x="12" y="24" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="600" fill="#e2e8f0">Google OAuth</text>
      <text x="12" y="42" font-family="ui-monospace, monospace" font-size="9.5" fill="#64748b">Campus verification</text>
    </g>

    <path d="M 274 28 L 284 28" stroke="rgba(255,255,255,0.25)" stroke-width="1.5" />
    <polygon points="284,25 288,28 284,31" fill="rgba(255,255,255,0.4)" />

    <g transform="translate(290, 0)">
      <rect width="125" height="56" rx="6" fill="#0f172a" stroke="rgba(255,255,255,0.12)" stroke-width="1" />
      <text x="12" y="24" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="600" fill="#e2e8f0">Match Engine</text>
      <text x="12" y="42" font-family="ui-monospace, monospace" font-size="9.5" fill="#64748b">Tag & location filter</text>
    </g>

    <path d="M 419 28 L 429 28" stroke="rgba(255,255,255,0.25)" stroke-width="1.5" />
    <polygon points="429,25 433,28 429,31" fill="rgba(255,255,255,0.4)" />

    <g transform="translate(435, 0)">
      <rect width="125" height="56" rx="6" fill="#0f172a" stroke="rgba(255,255,255,0.12)" stroke-width="1" />
      <text x="12" y="24" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="600" fill="#e2e8f0">Socket.IO</text>
      <text x="12" y="42" font-family="ui-monospace, monospace" font-size="9.5" fill="#64748b">Live claim chat</text>
    </g>

    <path d="M 564 28 L 574 28" stroke="rgba(255,255,255,0.25)" stroke-width="1.5" />
    <polygon points="574,25 578,28 574,31" fill="rgba(255,255,255,0.4)" />

    <g transform="translate(580, 0)">
      <rect width="125" height="56" rx="6" fill="#0f172a" stroke="rgba(255,255,255,0.12)" stroke-width="1" />
      <text x="12" y="24" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="600" fill="#e2e8f0">Resolution</text>
      <text x="12" y="42" font-family="ui-monospace, monospace" font-size="9.5" fill="#64748b">Verified handoff</text>
    </g>

  </g>

  <!-- Code window -->
  <g transform="translate(40, 175)">
    <rect width="720" height="280" rx="8" fill="#030508" stroke="rgba(255,255,255,0.08)" />
    <!-- Window header -->
    <rect width="720" height="34" rx="8" fill="rgba(255,255,255,0.025)" />
    <circle cx="16" cy="17" r="4.5" fill="#ef4444" opacity="0.7"/>
    <circle cx="30" cy="17" r="4.5" fill="#f59e0b" opacity="0.7"/>
    <circle cx="44" cy="17" r="4.5" fill="#10b981" opacity="0.7"/>
    <text x="64" y="21" font-family="ui-monospace, monospace" font-size="11" fill="#94a3b8">socketChat.js</text>
    <text x="680" y="21" font-family="ui-monospace, monospace" font-size="10" fill="#475569">JavaScript</text>
    <line x1="0" y1="34" x2="720" y2="34" stroke="rgba(255,255,255,0.06)" />
    <text x="16" y="62" font-family="ui-monospace, monospace" font-size="11" fill="#334155">01</text>
    <text x="50" y="62" font-family="ui-monospace, monospace" font-size="11.5"><tspan fill="#cbd5e1">io.</tspan><tspan fill="#f59e0b">use</tspan><tspan fill="#cbd5e1">(verifyCampusOAuth).</tspan><tspan fill="#f59e0b">on</tspan><tspan fill="#cbd5e1">('connection', (socket) =&gt; {</tspan></text>
    <text x="16" y="84" font-family="ui-monospace, monospace" font-size="11" fill="#334155">02</text>
    <text x="50" y="84" font-family="ui-monospace, monospace" font-size="11.5"><tspan fill="#cbd5e1">  socket.</tspan><tspan fill="#f59e0b">on</tspan><tspan fill="#cbd5e1">('join_claim_room', async ({ itemId }) =&gt; {</tspan></text>
    <text x="16" y="106" font-family="ui-monospace, monospace" font-size="11" fill="#334155">03</text>
    <text x="50" y="106" font-family="ui-monospace, monospace" font-size="11.5"><tspan fill="#cbd5e1">    socket.</tspan><tspan fill="#f59e0b">join</tspan><tspan fill="#cbd5e1">(`item:${itemId}`);</tspan></text>
    <text x="16" y="128" font-family="ui-monospace, monospace" font-size="11" fill="#334155">04</text>
    <text x="50" y="128" font-family="ui-monospace, monospace" font-size="11.5"><tspan fill="#cbd5e1">    const recentChat = await Message.</tspan><tspan fill="#f59e0b">find</tspan><tspan fill="#cbd5e1">({ item: itemId }).</tspan><tspan fill="#f59e0b">limit</tspan><tspan fill="#cbd5e1">(50);</tspan></text>
    <text x="16" y="150" font-family="ui-monospace, monospace" font-size="11" fill="#334155">05</text>
    <text x="50" y="150" font-family="ui-monospace, monospace" font-size="11.5"><tspan fill="#cbd5e1">    socket.</tspan><tspan fill="#f59e0b">emit</tspan><tspan fill="#cbd5e1">('chat_history', recentChat);</tspan></text>
    <text x="16" y="172" font-family="ui-monospace, monospace" font-size="11" fill="#334155">06</text>
    <text x="50" y="172" font-family="ui-monospace, monospace" font-size="11.5"><tspan fill="#cbd5e1">  });</tspan></text>
    <text x="16" y="194" font-family="ui-monospace, monospace" font-size="11" fill="#334155">07</text>
    <text x="50" y="194" font-family="ui-monospace, monospace" font-size="11.5"><tspan fill="#cbd5e1">  socket.</tspan><tspan fill="#f59e0b">on</tspan><tspan fill="#cbd5e1">('send_claim_message', async (payload) =&gt; {</tspan></text>
    <text x="16" y="216" font-family="ui-monospace, monospace" font-size="11" fill="#334155">08</text>
    <text x="50" y="216" font-family="ui-monospace, monospace" font-size="11.5"><tspan fill="#cbd5e1">    const saved = await Message.</tspan><tspan fill="#f59e0b">create</tspan><tspan fill="#cbd5e1">(payload);</tspan></text>
    <text x="16" y="238" font-family="ui-monospace, monospace" font-size="11" fill="#334155">09</text>
    <text x="50" y="238" font-family="ui-monospace, monospace" font-size="11.5"><tspan fill="#cbd5e1">    io.</tspan><tspan fill="#f59e0b">to</tspan><tspan fill="#cbd5e1">(`item:${payload.itemId}`).</tspan><tspan fill="#f59e0b">emit</tspan><tspan fill="#cbd5e1">('new_message', saved);</tspan></text>
    <text x="16" y="260" font-family="ui-monospace, monospace" font-size="11" fill="#334155">10</text>
    <text x="50" y="260" font-family="ui-monospace, monospace" font-size="11.5"><tspan fill="#cbd5e1">  });</tspan></text>
    <text x="16" y="282" font-family="ui-monospace, monospace" font-size="11" fill="#334155">11</text>
    <text x="50" y="282" font-family="ui-monospace, monospace" font-size="11.5"><tspan fill="#cbd5e1">});</tspan></text>
  </g>
</svg>