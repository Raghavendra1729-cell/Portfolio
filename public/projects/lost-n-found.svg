    <circle cx="16" cy="14" r="4" fill="#ef4444" opacity="0.8"/>
    <circle cx="28" cy="14" r="4" fill="#f59e0b" opacity="0.8"/>
    <circle cx="40" cy="14" r="4" fill="#10b981" opacity="0.8"/>
    <text x="56" y="18" font-family="monospace" font-size="10" fill="#64748b">execution-log</text>
    <text x="20" y="54" font-family="monospace" font-size="11.5" fill="#cbd5e1">[POST]  New item reported: 'Blue Dell Laptop Charger' near Library 2F</text>
