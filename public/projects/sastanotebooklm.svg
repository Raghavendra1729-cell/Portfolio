<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0d14" />
      <stop offset="100%" stop-color="#05070a" />
    </linearGradient>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="800" height="500" fill="url(#bg)" />
  <rect width="800" height="500" fill="url(#grid)" />
  <rect x="20" y="20" width="760" height="460" rx="12" fill="rgba(255,255,255,0.01)" stroke="rgba(255,255,255,0.08)" />

  <!-- Top bar -->
  <g transform="translate(40, 42)">
    <text x="0" y="16" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="700" fill="#ffffff">SastaNotebookLm — Document RAG</text>
    <text x="0" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#94a3b8">Grounded question answering over PDF & TXT documents using Gemini & Qdrant</text>
  </g>

  <!-- Flow pipeline -->
  <g transform="translate(40, 96)">

    <g transform="translate(0, 0)">
      <rect width="125" height="56" rx="6" fill="#0f172a" stroke="rgba(255,255,255,0.12)" stroke-width="1" />
      <text x="12" y="24" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="600" fill="#e2e8f0">Document Ingest</text>
      <text x="12" y="42" font-family="ui-monospace, monospace" font-size="9.5" fill="#64748b">PDF / TXT parsing</text>
    </g>

    <path d="M 129 28 L 139 28" stroke="rgba(255,255,255,0.25)" stroke-width="1.5" />
    <polygon points="139,25 143,28 139,31" fill="rgba(255,255,255,0.4)" />

    <g transform="translate(145, 0)">
      <rect width="125" height="56" rx="6" fill="#0f172a" stroke="rgba(255,255,255,0.12)" stroke-width="1" />
      <text x="12" y="24" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="600" fill="#e2e8f0">Chunking</text>
      <text x="12" y="42" font-family="ui-monospace, monospace" font-size="9.5" fill="#64748b">512 token overlap</text>
    </g>

    <path d="M 274 28 L 284 28" stroke="rgba(255,255,255,0.25)" stroke-width="1.5" />
    <polygon points="284,25 288,28 284,31" fill="rgba(255,255,255,0.4)" />

    <g transform="translate(290, 0)">
      <rect width="125" height="56" rx="6" fill="#0f172a" stroke="rgba(255,255,255,0.12)" stroke-width="1" />
      <text x="12" y="24" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="600" fill="#e2e8f0">Gemini Embed</text>
      <text x="12" y="42" font-family="ui-monospace, monospace" font-size="9.5" fill="#64748b">768-dim vectors</text>
    </g>

    <path d="M 419 28 L 429 28" stroke="rgba(255,255,255,0.25)" stroke-width="1.5" />
    <polygon points="429,25 433,28 429,31" fill="rgba(255,255,255,0.4)" />

    <g transform="translate(435, 0)">
      <rect width="125" height="56" rx="6" fill="#0f172a" stroke="rgba(255,255,255,0.12)" stroke-width="1" />
      <text x="12" y="24" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="600" fill="#e2e8f0">Qdrant Store</text>
      <text x="12" y="42" font-family="ui-monospace, monospace" font-size="9.5" fill="#64748b">HNSW cosine index</text>
    </g>

    <path d="M 564 28 L 574 28" stroke="rgba(255,255,255,0.25)" stroke-width="1.5" />
    <polygon points="574,25 578,28 574,31" fill="rgba(255,255,255,0.4)" />

    <g transform="translate(580, 0)">
      <rect width="125" height="56" rx="6" fill="#0f172a" stroke="rgba(255,255,255,0.12)" stroke-width="1" />
      <text x="12" y="24" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="600" fill="#e2e8f0">Grounded LLM</text>
      <text x="12" y="42" font-family="ui-monospace, monospace" font-size="9.5" fill="#64748b">Citation synthesis</text>
    </g>

  </g>

  <!-- Code window -->
  <g transform="translate(40, 175)">
    <rect width="720" height="280" rx="8" fill="#030508" stroke="rgba(255,255,255,0.08)" />
    <!-- Window header -->
    <rect width="720" height="34" rx="8" fill="rgba(255,255,255,0.025)" />
    <circle cx="16" cy="17" r="4.5" fill="#ef4444" opacity="0.7"/>
    <circle cx="30" cy="17" r="4.5" fill="#f59e0b" opacity="0.7"/>
    <circle cx="44" cy="17" r="4.5" fill="#10b981" opacity="0.7"/>
    <text x="64" y="21" font-family="ui-monospace, monospace" font-size="11" fill="#94a3b8">rag_service.py</text>
    <text x="680" y="21" font-family="ui-monospace, monospace" font-size="10" fill="#475569">Python</text>
    <line x1="0" y1="34" x2="720" y2="34" stroke="rgba(255,255,255,0.06)" />
    <text x="16" y="62" font-family="ui-monospace, monospace" font-size="11" fill="#334155">01</text>
    <text x="50" y="62" font-family="ui-monospace, monospace" font-size="11.5"><tspan fill="#c084fc">async def </tspan><tspan fill="#f59e0b">ask_document</tspan><tspan fill="#94a3b8">(query: </tspan><tspan fill="#38bdf8">str</tspan><tspan fill="#94a3b8">, doc_id: </tspan><tspan fill="#38bdf8">str</tspan><tspan fill="#94a3b8">): </tspan></text>
    <text x="16" y="84" font-family="ui-monospace, monospace" font-size="11" fill="#334155">02</text>
    <text x="50" y="84" font-family="ui-monospace, monospace" font-size="11.5"><tspan fill="#cbd5e1">    query_vector = await gemini.</tspan><tspan fill="#f59e0b">embed_text</tspan><tspan fill="#94a3b8">(query)</tspan></text>
    <text x="16" y="106" font-family="ui-monospace, monospace" font-size="11" fill="#334155">03</text>
    <text x="50" y="106" font-family="ui-monospace, monospace" font-size="11.5"><tspan fill="#cbd5e1">    hits = await qdrant_client.</tspan><tspan fill="#f59e0b">search</tspan><tspan fill="#94a3b8">(</tspan></text>
    <text x="16" y="128" font-family="ui-monospace, monospace" font-size="11" fill="#334155">04</text>
    <text x="50" y="128" font-family="ui-monospace, monospace" font-size="11.5"><tspan fill="#cbd5e1">        collection_name=doc_id, query_vector=query_vector, limit=4</tspan></text>
    <text x="16" y="150" font-family="ui-monospace, monospace" font-size="11" fill="#334155">05</text>
    <text x="50" y="150" font-family="ui-monospace, monospace" font-size="11.5"><tspan fill="#94a3b8">    )</tspan></text>
    <text x="16" y="172" font-family="ui-monospace, monospace" font-size="11" fill="#334155">06</text>
    <text x="50" y="172" font-family="ui-monospace, monospace" font-size="11.5"><tspan fill="#cbd5e1">    context_passages = [h.payload['text'] for h in hits]</tspan></text>
    <text x="16" y="194" font-family="ui-monospace, monospace" font-size="11" fill="#334155">07</text>
    <text x="50" y="194" font-family="ui-monospace, monospace" font-size="11.5"><tspan fill="#cbd5e1">    response = await gemini.</tspan><tspan fill="#f59e0b">generate</tspan><tspan fill="#94a3b8">(</tspan></text>
    <text x="16" y="216" font-family="ui-monospace, monospace" font-size="11" fill="#334155">08</text>
    <text x="50" y="216" font-family="ui-monospace, monospace" font-size="11.5"><tspan fill="#a7f3d0">        model='gemini-1.5-flash',</tspan></text>
    <text x="16" y="238" font-family="ui-monospace, monospace" font-size="11" fill="#334155">09</text>
    <text x="50" y="238" font-family="ui-monospace, monospace" font-size="11.5"><tspan fill="#cbd5e1">        prompt=build_grounded_prompt(query, context_passages)</tspan></text>
    <text x="16" y="260" font-family="ui-monospace, monospace" font-size="11" fill="#334155">10</text>
    <text x="50" y="260" font-family="ui-monospace, monospace" font-size="11.5"><tspan fill="#94a3b8">    )</tspan></text>
  </g>
</svg>